name: Isolated E2E runner

on:
  workflow_call:
    inputs:
      tier:
        type: string
        required: true
      family:
        type: string
        default: ''
      source_sha:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      family:
        description: 'One catalog family for diagnosis; full nightly validation remains required'
        type: string
        required: true

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Provision Electron display and native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox libnss3 libatk-bridge2.0-0t64 libgtk-3-0t64 libgbm1 libasound2t64 openssl zip fonts-noto-cjk
          # Enable Electron's own user-namespace sandbox on this ephemeral CI VM.
          # No --no-sandbox or renderer sandbox bypass is used.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install clean-runner dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch the Electron binary
        # Electron's npm package fetches its binary on first use, not on install,
        # and the suites look for it directly under node_modules/electron/dist.
        run: node apps/desktop/node_modules/electron/install.js
      - name: Build and attest the candidate Host, workspace and Desktop
        run: |
          node scripts/e2e/build-candidate.mjs
          mkdir -p .artifacts/e2e
          cp .review-evidence/build-candidate.json .artifacts/e2e/build-candidate.json
      - name: Bundle the candidate sidecar
        run: pnpm --filter @pi-desktop/agent-runtime bundle
      - name: Verify suite and generated scenario catalog
        run: node scripts/generate-scenario-index.mjs --check
      - name: Run isolated fixture suites
        env:
          E2E_TIER: ${{ inputs.tier || 'nightly' }}
          E2E_FAMILY: ${{ inputs.family }}
          PI_DESKTOP_HOST_BIN: ${{ github.workspace }}/target/debug/pi-desktop-host-core
        run: |
          mkdir -p .artifacts/e2e
          xvfb-run -a sh -c 'openbox > /tmp/pi-e2e-openbox.log 2>&1 & node scripts/e2e-suite.mjs --tier "$E2E_TIER" ${E2E_FAMILY:+--family "$E2E_FAMILY"} --report .artifacts/e2e/result.json'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-${{ inputs.tier || 'nightly' }}-${{ inputs.family || 'smoke' }}
          path: .artifacts/e2e/
