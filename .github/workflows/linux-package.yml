name: Linux package validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux x64 packages
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux packages
        run: pnpm --filter @pi-desktop/desktop run dist:linux -- --x64

      - name: Verify Linux host glibc floor
        run: node scripts/check-linux-host-glibc.mjs target/release/pi-desktop-host-core

      - name: Install RPM inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm

      - name: Verify RPM package
        run: |
          set -euo pipefail
          mapfile -t packages < <(find apps/desktop/release -maxdepth 1 -type f -name '*.rpm' -print)
          test "${#packages[@]}" -eq 1
          rpm -qip "${packages[0]}"
          rpm -qpl "${packages[0]}" | grep -Fx '/opt/PI-Desktop/resources/app.asar'
          rpm -qpl "${packages[0]}" | grep -Fx '/opt/PI-Desktop/resources/bin/pi-desktop-host-core'
          rpm -qpl "${packages[0]}" | grep -Fx '/usr/share/applications/pi-desktop.desktop'

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-linux-x64-rpm
          if-no-files-found: error
          retention-days: 7
          path: apps/desktop/release/*.rpm
