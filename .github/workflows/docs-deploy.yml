name: Docs deployment

# Vercel Git deployments are disabled in docs/vercel.json. The documentation
# site is published from the exact release tag instead of every branch push.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (normally a release tag)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docs-deploy-${{ github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Install Vercel CLI
        run: npm install --global vercel@59.23.2

      - name: Pull Vercel production configuration
        working-directory: docs
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build the documentation deployment
        working-directory: docs
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Publish the documentation deployment
        working-directory: docs
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
