  </div>
  <div style="position:absolute;left:100px;bottom:24px;width:760px">
    <div role="menu" style="position:absolute;right:79px;bottom:79px;width:348px;box-sizing:border-box;padding:5px;border-radius:20px;background:var(--elev);box-shadow:0 0 0 0.5px var(--stroke),0 16px 48px rgba(0,0,0,0.55);z-index:2;color:var(--text)">

      <div role="menuitemradio" aria-checked="false" style="display:flex;align-items:center;gap:8px;height:36px;box-sizing:border-box;padding:0 8px;border-radius:10px;font-size:12px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted)"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Qwen3.8-Flash</span><span style="font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums">128K</span><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted)"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
      <div style="padding:6px 8px 2px;font-size:11px;font-weight:600;color:var(--muted)">DeepSeek</div>
      <div role="menuitemradio" aria-checked="false" style="display:flex;align-items:center;gap:8px;height:36px;box-sizing:border-box;padding:0 8px;border-radius:10px;font-size:12px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted)"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">DeepSeek V4.1 Flash</span><span style="font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums">128K</span><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted)"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/></svg></div>
      <div style="height:1px;margin:6px 4px;background:var(--line)"></div>
      <div style="padding:2px 6px 6px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:12px;color:var(--muted)"><span>推理等级</span><span style="height:16px;padding:0 6px;border-radius:999px;background:var(--press);color:var(--secondary);font-size:10px;line-height:16px">提议</span></div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:2px;border-radius:10px;background:var(--hover)">
          <span style="height:28px;display:grid;place-items:center;border-radius:8px;font-size:12px;color:var(--muted)">关闭</span>
          <span style="height:28px;display:grid;place-items:center;border-radius:8px;font-size:12px;color:var(--muted)">低</span>
          <span style="height:28px;display:grid;place-items:center;border-radius:8px;font-size:12px;color:var(--muted)">中</span>
          <span style="height:28px;display:grid;place-items:center;border-radius:8px;font-size:12px;font-weight:600;background:var(--press);color:var(--text)">高</span>
        </div>
      </div>
      <div style="height:1px;margin:6px 4px;background:var(--line)"></div>
      <div style="display:flex;align-items:center;gap:8px;height:36px;box-sizing:border-box;padding:0 8px;border-radius:10px;font-size:12px;color:var(--secondary)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>模型配置</span></div>
    </div>
    <div style="margin:0 24px -14px;padding:10px 20px 24px;box-sizing:border-box;background:var(--strip);border-radius:16px 16px 0 0;display:flex;align-items:center;gap:20px;color:var(--muted);font-size:13px;line-height:18px">
      <span style="display:inline-flex;align-items:center;gap:7px;color:var(--text)"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>PI-Desktop</span>
      <span style="display:inline-flex;align-items:center;gap:7px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>本地</span>
      <span style="display:inline-flex;align-items:center;gap:7px;min-width:0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 8v8M18 10c0 4-6 4-12 6"/></svg><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px">codex/review-result-format</span></span>
    </div>
    <div style="position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 7.5px #0000000a,0 0 20px #0000000d;box-sizing:border-box;isolation:isolate">
      <div style="padding:16px 16px 0">
        <textarea aria-label="消息" placeholder="发消息或创建任务，/ 调用指令，@ 文件或对话" rows="1" style="display:block;width:100%;height:24px;box-sizing:border-box;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:14px;line-height:20px;padding:0;margin:0"></textarea>
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding:8px 10px 10px">
        <div style="display:flex;align-items:center;gap:8px;min-width:0">
          <button type="button" aria-label="添加内容" style="width:28px;height:28px;padding:0;border:0;border-radius:999px;background:transparent;color:var(--icon);display:grid;place-items:center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <button type="button" style="height:28px;padding:0 8px;border:0;border-radius:999px;background:transparent;color:var(--secondary);display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:12px;white-space:nowrap"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><span>单智能体</span><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
        <div style="display:flex;align-items:center;gap:4px;margin-left:auto">
          <button type="button" aria-haspopup="menu" aria-expanded="true" style="height:28px;padding:0 8px;border:0;border-radius:999px;background:var(--press);color:var(--text);display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:12px;white-space:nowrap"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg><span>Qwen3.8-Max</span><span style="color:var(--muted)">·</span><span>高</span><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(180deg)"><path d="M6 9l6 6 6-6"/></svg></button>

          <button type="button" aria-label="发送" style="width:32px;height:32px;padding:0;border:0;border-radius:10px;background:var(--send-bg);color:var(--send-fg);display:grid;place-items:center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></button>
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;gap:22px;margin-top:14px;color:var(--muted);font-size:13px;line-height:18px">
      <span style="display:inline-flex;align-items:center;gap:6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15a8 8 0 1 1 16 0M12 15l4-4"/></svg>2 轮 12 步 · 235 tok/s</span>
      <span style="display:inline-flex;align-items:center;gap:6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v14c0 1.7 3.1 3 7 3s7-1.3 7-3V5"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>630K tok · 缓存命中 87%</span>

    </div>
  </div>
</div>
</x-dc>

}

</script>
