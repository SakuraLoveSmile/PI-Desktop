<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Composer dark idle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
textarea::placeholder{color:var(--placeholder);opacity:1}
</style>
</helmet>
<div style="--ground:#181818;--strip:#262628;--card:#212121f5;--line:rgba(255,255,255,0.05);--text:#ffffff;--icon:rgba(255,255,255,0.78);--secondary:rgba(255,255,255,0.7);--muted:rgba(255,255,255,0.52);--placeholder:rgba(255,255,255,0.42);--accent:#ffffff;--send-bg:rgba(255,255,255,0.18);--send-fg:rgba(24,24,24,0.7);--stop-bg:rgba(255,255,255,0.16);--live:#40c977;width:960px;height:260px;box-sizing:border-box;position:relative;background:var(--ground);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',system-ui,sans-serif">
  <div style="position:absolute;left:24px;top:16px;font-size:12px;line-height:18px;color:var(--muted)">空闲时：顶部条展开</div>
  <div style="width:760px;display:flex;flex-direction:column">
    <div style="margin:0 24px -14px;padding:10px 20px 24px;box-sizing:border-box;background:var(--strip);border-radius:16px 16px 0 0;display:flex;align-items:center;gap:20px;color:var(--muted);font-size:13px;line-height:18px">
      <span style="display:inline-flex;align-items:center;gap:7px;color:var(--text)"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>PI-Desktop</span>
      <span style="display:inline-flex;align-items:center;gap:7px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>本地</span>
      <span style="display:inline-flex;align-items:center;gap:7px;min-width:0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 8v8M18 10c0 4-6 4-12 6"/></svg><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px">codex/review-result-format</span></span>
    </div>
    <div style="position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 7.5px #0000000a,0 0 20px #0000000d;box-sizing:border-box;isolation:isolate">
      <div style="padding:16px 16px 0">
        <textarea aria-label="消息" placeholder="发消息或创建任务，/ 调用指令，@ 文件或对话" rows="1" style="display:block;width:100%;height:24px;box-sizing:border-box;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:14px;line-height:20px;padding:0;margin:0"></textarea>
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding:8px 10px 10px">
        <div style="display:flex;align-items:center;gap:8px;min-width:0">
          <button type="button" aria-label="添加内容" style="width:28px;height:28px;padding:0;border:0;border-radius:999px;background:transparent;color:var(--icon);display:grid;place-items:center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <button type="button" style="height:28px;padding:0 8px;border:0;border-radius:999px;background:transparent;color:var(--secondary);display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:12px;white-space:nowrap"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><span>单智能体</span><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
        <div style="display:flex;align-items:center;gap:4px;margin-left:auto">
          <button type="button" style="height:28px;padding:0 8px;border:0;border-radius:999px;background:transparent;color:var(--secondary);display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:12px;white-space:nowrap"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg><span>Qwen3.8-Max</span><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
          <button type="button" aria-label="优化提示词" style="width:28px;height:28px;padding:0;border:0;border-radius:999px;background:transparent;color:var(--icon);display:grid;place-items:center"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8 2.2L16 18l2.2-.8z"/></svg></button>
          <button type="button" aria-label="发送" style="width:32px;height:32px;padding:0;border:0;border-radius:10px;background:var(--send-bg);color:var(--send-fg);display:grid;place-items:center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></button>
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;gap:22px;margin-top:14px;color:var(--muted);font-size:13px;line-height:18px">
      <span style="display:inline-flex;align-items:center;gap:6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15a8 8 0 1 1 16 0M12 15l4-4"/></svg>2 轮 12 步 · 235 tok/s</span>
      <span style="display:inline-flex;align-items:center;gap:6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v14c0 1.7 3.1 3 7 3s7-1.3 7-3V5"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>630K tok · 缓存命中 87%</span>
      <span style="display:inline-flex;align-items:center;gap:6px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" style="color:var(--muted)"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-opacity="0.2" stroke-width="2"/><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="3.4 37.7" transform="rotate(-90 8 8)"/></svg>已用 9%</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":260}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
