[package]
name = "update-helper"
# Independent of the application version: the release scripts bump only the
# host-core entry of Cargo.lock, so this lock entry must stay stable.
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "PI-Desktop installer helper for the assisted macOS update"
publish = false

[[bin]]
name = "pi-desktop-update-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
