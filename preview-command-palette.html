<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command Palette — style preview</title>
  <link rel="stylesheet" href="apps/desktop/src/styles/globals.css" />
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .preview-bar {
      position: fixed; top: 12px; right: 12px; z-index: 999;
      display: flex; gap: 8px; align-items: center;
      padding: 8px 10px; border-radius: 10px;
      background: var(--ds-bg-elevated-opaque); color: var(--ds-text-secondary);
      border: 1px solid var(--ds-border-default); font-size: 13px;
    }
    .preview-bar button {
      cursor: pointer; border: 1px solid var(--ds-border-default);
      background: var(--ds-bg-hover); color: var(--ds-text-primary);
      border-radius: 8px; padding: 4px 10px; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="preview-bar">
    <span>主题</span>
    <button id="theme-light">Light</button>
    <button id="theme-dark">Dark</button>
  </div>

  <!-- Render the palette exactly as CommandPalette.tsx produces it -->
  <div class="palette-overlay">
    <div class="palette-dialog" role="dialog" aria-label="Command palette">
      <div class="palette-input-row">
        <svg class="palette-input-icon" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input class="palette-input" placeholder="搜索命令…" aria-label="搜索命令…" />
      </div>
      <div class="palette-results" role="listbox" aria-label="Command palette">
        <div role="group" aria-label="Session">
          <div class="palette-group-label">Session</div>
          <button type="button" role="option" aria-selected="true" class="palette-item active">
            <span class="palette-item-title">New task</span>
          </button>
          <button type="button" role="option" aria-selected="false" class="palette-item">
            <span class="palette-item-title">Delete current task</span>
          </button>
          <button type="button" role="option" aria-selected="false" class="palette-item">
            <span class="palette-item-title">Switch to Agent mode</span>
          </button>
        </div>
        <div role="group" aria-label="Project">
          <div class="palette-group-label">Project</div>
          <button type="button" role="option" aria-selected="false" class="palette-item">
            <span class="palette-item-title">Open project</span>
          </button>
          <button type="button" role="option" aria-selected="false" class="palette-item">
            <span class="palette-item-title">Clear project</span>
          </button>
        </div>
        <div role="group" aria-label="Plugins">
          <div class="palette-group-label">Plugins</div>
          <button type="button" role="option" aria-selected="false" class="palette-item">
            <span class="palette-item-title">Summarize selection</span>
            <span class="palette-item-badge">插件</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const html = document.documentElement;
    document.getElementById("theme-light").onclick = () => html.setAttribute("data-theme", "light");
    document.getElementById("theme-dark").onclick = () => html.setAttribute("data-theme", "dark");
  </script>
</body>
</html>
