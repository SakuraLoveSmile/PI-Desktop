name: Mirror to CNB

# Keep the CNB copy byte-identical and self-consistent.
#
# The mirror serves the same packages under a different base URL, so it needs
# its own catalog: `artifactBaseUrl` is what keeps a client that switched
# source from resolving a download back to GitHub. Everything else — file
# names, sizes, checksums — is identical, so switching source never changes
# the checksum being verified.
on:
  push:
    branches: [main]
    paths:
      - "catalog.json"
      - "catalog/**"
      - "registry/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-cnb
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment: mirror
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the mirror catalog
        run: |
          GENERATED_AT="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('catalog.json','utf8')).generatedAt ?? '')")"
          node scripts/build-catalog.mjs \
            --base "${{ vars.CNB_ARTIFACT_BASE_URL }}" \
            --out /tmp/mirror/catalog.json \
            --shards /tmp/mirror/catalog/plugins \
            --generated-at "$GENERATED_AT"

      - name: Check the mirror catalog against the client contract
        run: node scripts/check-catalog-client-contract.mjs --url /tmp/mirror/catalog.json

      - name: Push to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
        run: |
          test -n "$CNB_TOKEN" || { echo "::error::CNB_TOKEN is not configured"; exit 1; }
          git clone --depth 1 "https://oauth2:${CNB_TOKEN}@${CNB_REPO}" /tmp/cnb
          cp /tmp/mirror/catalog.json /tmp/cnb/catalog.json
          mkdir -p /tmp/cnb/catalog/plugins
          cp -a /tmp/mirror/catalog/plugins/. /tmp/cnb/catalog/plugins/
          cd /tmp/cnb
          git config user.name "pi-plugin-center"
          git config user.email "bot@pi-plugin-center.dev"
          if git diff --quiet; then
            echo "mirror already current"
            exit 0
          fi
          git add -A
          git commit -m "chore(mirror): sync catalog from pi-plugin-center"
          git push

  verify:
    # Re-download from the mirror and compare against the registry. A mirror
    # that drifts is worse than no mirror: it fails the client's checksum after
    # the user has already waited for the download.
    needs: mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/verify-artifact.mjs --base "${{ vars.CNB_ARTIFACT_BASE_URL }}"
